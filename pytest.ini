[pytest]
minversion = 7.0
addopts = -ra -q -m "not e2e"
testpaths = tests
pythonpath = . src

markers =
    e2e: Test end-to-end che invocano make e richiedono csound installato

# Il motore non legge la superficie deprecata dello Stream (issue #285):
# un FutureWarning «Stream.<nome> e' deprecata» attribuito a un modulo `pge`
# (stacklevel=2, cioe' a chi legge) e' un errore in ogni test, non una riga
# nel riepilogo. Chi la legge da un test resta un avviso, che i test delle
# deprecazioni chiedono con pytest.warns. Verificato in
# tests/core/test_stream_deprecazioni.py::TestIlMotoreNonLiLegge.
filterwarnings =
    error:Stream\.:FutureWarning:pge\b
