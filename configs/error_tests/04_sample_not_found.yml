# Trigger: SampleNotFoundError (gia esistente, non parte di PR1 ma copertura completa)
# Atteso: [ERRORE] Sample non trovato: 'pinuzzo_inesistente.wav'
#         Path cercato: ./refs/pinuzzo_inesistente.wav
#         Stream: stream_missing_file
#         Config: configs/error_tests/04_sample_not_found.yml

composition:
  title: "test sample not found"

streams:
  - stream_id: "stream_missing_file"
    onset: 0.0
    duration: 5
    sample: "pinuzzo_inesistente.wav"   # <-- file non esiste in ./refs/
    distribution_mode: 'gaussian'
    density: 5
    distribution: [[0,1],[1,1]]
    pointer:
      speed_ratio: 1.0
    grain:
      duration: 0.05
      duration_range: 0.01
