# Trigger: MissingFieldError(fields=['duration', 'onset'])
# Atteso: [ERRORE] Campi obbligatori mancanti: 'duration', 'onset'
#         Stream: stream_no_ctx
#         Config: configs/error_tests/02_missing_context_fields.yml

composition:
  title: "test missing context fields"

streams:
  - stream_id: "stream_no_ctx"
    # onset: <-- mancante
    # duration: <-- mancante
    sample: "pino.wav"
    distribution_mode: 'gaussian'
    density: 5
    distribution: [[0,1],[1,1]]
    pointer:
      speed_ratio: 1.0
    grain:
      duration: 0.05
      duration_range: 0.01
