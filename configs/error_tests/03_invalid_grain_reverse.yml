# Trigger: InvalidFieldValueError(field='grain.reverse', value=True)
# Atteso: [ERRORE] Valore invalido per 'grain.reverse'
#         Trovato: True
#         Hint: grain.reverse deve essere lasciato vuoto...
#         Stream: stream_bad_reverse
#         Config: configs/error_tests/03_invalid_grain_reverse.yml

composition:
  title: "test invalid grain.reverse"

streams:
  - stream_id: "stream_bad_reverse"
    onset: 0.0
    duration: 5
    sample: "pino.wav"
    distribution_mode: 'gaussian'
    density: 5
    distribution: [[0,1],[1,1]]
    pointer:
      speed_ratio: 1.0
    grain:
      duration: 0.05
      duration_range: 0.01
      reverse: true   # <-- volutamente con valore (deve essere vuoto)
