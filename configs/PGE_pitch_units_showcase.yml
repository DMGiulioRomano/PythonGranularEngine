# PGE_pitch_units_showcase.yml
#
# Catalogo di TUTTE le possibilità del sistema pitch unit-driven (PR #84).
# Diviso in due parti:
#   PARTE A — blocco `pitch` base (trasposizione dello stream)
#   PARTE B — blocco `voices.pitch` (distribuzione pitch fra le voci)
#
# Conversione a ratio:
#   famiglia EDO → ratio = 2^(valore / N)   (N = divisioni per ottava)
#     semitones N=12 · quarter_tone N=24 · eighth_tone N=48 · cents N=1200 · edo N
#   ratio → moltiplicatore diretto (nessun esponente)
#
# Regole blocco pitch:
#   - UNA sola chiave-unità per blocco. Due insieme → InvalidFieldValueError.
#   - Nessuna chiave → default `semitones` con valore neutro (ratio 1.0).
#   - Chiave sconosciuta / refuso (es. `semitone:`) → InvalidFieldValueError
#     (validazione strict, niente silent default). Chiavi valide: 6 unità + `range`.
#
# Gli stream sono sfalsati nel tempo (onset crescente) per poterli ascoltare
# uno alla volta. Sample: 001-0-27_9.wav (presente in refs/).

duration: 185
bpm: 120

streams:

  # ===========================================================================
  # PARTE A — BLOCCO PITCH BASE
  # ===========================================================================

  # --- A1. semitones (scalare) — +12 = un'ottava sopra -------------------------
  - stream_id: "A1_semitones_scalar"
    onset: 0
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      semitones: 12
    pan: 0
    volume: -6

  # --- A2. semitones (envelope) — glissando -1 ott → +1 ott --------------------
  - stream_id: "A2_semitones_envelope"
    onset: 5
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      semitones: [[0, -12], [4, 12]]
    volume: -6

  # --- A3. semitones + range — base 0, ±6 semitoni random ----------------------
  - stream_id: "A3_semitones_range"
    onset: 10
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    dephase: 100              # forza l'applicazione della variazione stocastica
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      semitones: 0
      range: 6
    volume: -6

  # --- A4. cents — +50 cents (quarto di tono in 1200-EDO) ----------------------
  - stream_id: "A4_cents"
    onset: 15
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      cents: 50
    volume: -6

  # --- A5. quarter_tone — 3 quarti di tono (24-EDO) ----------------------------
  - stream_id: "A5_quarter_tone"
    onset: 20
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      quarter_tone: 3
    volume: -6

  # --- A6. eighth_tone — 6 ottavi di tono (48-EDO) -----------------------------
  - stream_id: "A6_eighth_tone"
    onset: 25
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      eighth_tone: 6
    volume: -6

  # --- A7. edo arbitrario — 18 gradi di 31-EDO ---------------------------------
  - stream_id: "A7_edo_31"
    onset: 30
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      edo: 31         # divisioni/ottava (intero > 0)
      value: 18       # 18 gradi di 31-EDO (scalare o envelope)
    volume: -6

  # --- A8. ratio (scalare) — 1.5 = quinta giusta (moltiplicatore diretto) ------
  - stream_id: "A8_ratio_scalar"
    onset: 35
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      ratio: 1.5
    volume: -6

  # --- A9. ratio (envelope) — sweep 0.5 → 2.0 (un'ottava sotto → sopra) ---------
  - stream_id: "A9_ratio_envelope"
    onset: 40
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      ratio: [[0, 0.5], [4, 2.0]]
    volume: -6

  # --- A10. ratio + range — base 1.0, ±0.1 random (variazione additiva) --------
  - stream_id: "A10_ratio_range"
    onset: 45
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    dephase: 100
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      ratio: 1.0
      range: 0.1
    volume: -6

  # ===========================================================================
  # PARTE B — BLOCCO VOICES.PITCH
  # `unit` possiede la geometria con cui la strategia materializza il fattore di
  # ratio: famiglia EDO additiva (2^(position·amount/N)), ratio geometrica
  # (amount^position). Sotto `unit: ratio` la spaziatura è quindi geometrica.
  # Default `unit: semitones`. La voce 0 resta sempre all'identità (ratio 1.0).
  # ===========================================================================

  # --- B1. step — voce i → i × step (semitoni, default) ------------------------
  - stream_id: "B1_step_semitones"
    onset: 50
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: step
        step: 3.0             # voci a 0, 3, 6, 9 semitoni
    volume: -9

  # --- B2. step — unit cents ---------------------------------------------------
  - stream_id: "B2_step_cents"
    onset: 55
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: step
        step: 50.0            # voci a 0, 50, 100, 150 cents
        unit: cents
    volume: -9

  # --- B3. step — unit edo arbitrario (gradi interpretati in 31-EDO) -----------
  - stream_id: "B3_step_edo31"
    onset: 60
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: step
        step: 2.0             # voci a 0, 2, 4, 6 gradi di 31-EDO
        unit: {edo: 31}
    volume: -9

  # --- B4. step — unit ratio (geometrico: voce i = step^i) ---------------------
  - stream_id: "B4_step_ratio"
    onset: 65
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {ratio: 1.0}
    voices:
      num_voices: 3
      pitch:
        strategy: step
        step: 1.5             # voce 0 invariata, voci 1..2 a ratio 1.5, 2.25 (1.5^i)
        unit: ratio
    volume: -9

  # --- B5. range — voci distribuite in [0, pitch_range] ---------------------
  - stream_id: "B5_range_semitones"
    onset: 70
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 5
      pitch:
        strategy: range
        pitch_range: 12.0  # 5 voci spalmate su un'ottava
    volume: -9

  # --- B6. range — unit eighth_tone --------------------------------------------
  - stream_id: "B6_range_eighth_tone"
    onset: 75
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 5
      pitch:
        strategy: range
        pitch_range: 24.0  # 24 ottavi di tono = 1 ottava, distribuiti in 48-EDO
        unit: eighth_tone
    volume: -9

  # --- B7. stochastic — offset fisso per voce (seeded), magnitudine time-varying
  - stream_id: "B7_stochastic_semitones"
    onset: 80
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 6
      pitch:
        strategy: stochastic
        pitch_range: 6.0   # ogni voce un offset random fisso in ±6 semitoni
    volume: -9

  # --- B8. stochastic — unit cents (magnitudine in cents) ----------------------
  - stream_id: "B8_stochastic_cents"
    onset: 85
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 6
      pitch:
        strategy: stochastic
        pitch_range: 100.0 # magnitudine ±100 (interpretata in cents)
        unit: cents
    volume: -9

  # --- B9. chord — accordo nominale (SOLO semitoni per vincolo v1) --------------
  - stream_id: "B9_chord_dom7"
    onset: 90
    duration: 4
    sample: "weNeedToTalkAboutIt.wav"
    pointer:
      speed_ratio: .03
      start: .3
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: chord
        chord: dom7           
    volume: -9

  # --- B10. chord — con rivolto (inversion) ------------------------------------
  - stream_id: "B10_chord_maj7_inv2"
    onset: 95
    duration: 4
    sample: "weNeedToTalkAboutIt.wav"
    pointer:
      speed_ratio: .03
      start: .3
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: chord
        chord: maj7
        inversion: 2          # secondo rivolto
    volume: -9

  # --- B11. spectral — parziali della serie armonica (SOLO semitoni) -----------
  - stream_id: "B11_spectral"
    onset: 100
    duration: 4
    sample: "weNeedToTalkAboutIt.wav"
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    pointer:
      speed_ratio: .03
      start: .3
    voices:
      num_voices: 6
      pitch:
        strategy: spectral    
    volume: -9

  # --- B12. base pitch + voices.pitch combinati --------------------------------
  #   trasposizione globale (+7 st) con accordo distribuito sopra.
  - stream_id: "B12_base_plus_voices"
    onset: 105
    duration: 4
    sample: "weNeedToTalkAboutIt.wav"
    pointer:
      speed_ratio: .03
      start: .3    
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      semitones: 7            # tutto lo stream trasposto di una quinta
    voices:
      num_voices: 3
      pitch:
        strategy: chord
        chord: min
    volume: -9

  # ===========================================================================
  # PARTE A (supplemento) — casi mancanti sul blocco pitch base
  # ===========================================================================

  # --- A11. edo + value envelope — sweep 0 → 31 gradi (0 → 1 ottava in 31-EDO) --
  - stream_id: "A11_edo_envelope"
    onset: 110
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      edo: 31
      value: [[0, 0], [4, 31]]   # glissando: 0 → 1 ottava in 31-EDO
    volume: -6

  # ===========================================================================
  # PARTE B (supplemento) — combinazioni strategia × unità mancanti
  # ===========================================================================

  # --- B13. step / quarter_tone ------------------------------------------------
  - stream_id: "B13_step_quarter_tone"
    onset: 115
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: step
        step: 2.0          # voci a 0, 1, 2, 3 quarti di tono (24-EDO)
        unit: quarter_tone
    volume: -9

  # --- B14. step / eighth_tone -------------------------------------------------
  - stream_id: "B14_step_eighth_tone"
    onset: 120
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: step
        step: 4.0          # voci a 0, 4, 8, 12 ottavi di tono (48-EDO) = 0, 1, 2, 3 quarti
        unit: eighth_tone
    volume: -9

  # --- B15. range / cents ------------------------------------------------------
  - stream_id: "B15_range_cents"
    onset: 125
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 5
      pitch:
        strategy: range
        pitch_range: 1200.0   # 5 voci spalmate su un'ottava (1200 cents)
        unit: cents
    volume: -9

  # --- B16. range / quarter_tone -----------------------------------------------
  - stream_id: "B16_range_quarter_tone"
    onset: 130
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 5
      pitch:
        strategy: range
        pitch_range: 24.0     # 5 voci spalmate su 24 quarti = 1 ottava (24-EDO)
        unit: quarter_tone
    volume: -9

  # --- B17. range / edo (31-EDO) -----------------------------------------------
  - stream_id: "B17_range_edo31"
    onset: 135
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 5
      pitch:
        strategy: range
        pitch_range: 31.0     # 5 voci spalmate su 31 gradi = 1 ottava in 31-EDO
        unit: {edo: 31}
    volume: -9

  # --- B18. range / ratio — distribuzione GEOMETRICA ---------------------------
  #   Il caso chiave del refactor: amount^position invece di lineare.
  #   4 voci, range=2 → ratio [1.0, 1.26, 1.587, 2.0] (2^[0,1/3,2/3,1]).
  - stream_id: "B18_range_ratio"
    onset: 140
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {ratio: 1.0}
    voices:
      num_voices: 4
      pitch:
        strategy: range
        pitch_range: 2.0      # geometrico: voci a ratio 1.0, 1.26, 1.587, 2.0
        unit: ratio
    volume: -9

  # --- B19. stochastic / quarter_tone ------------------------------------------
  - stream_id: "B19_stochastic_quarter_tone"
    onset: 145
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 6
      pitch:
        strategy: stochastic
        pitch_range: 12.0     # ±12 quarti di tono = ±1 ottava
        unit: quarter_tone
    volume: -9

  # --- B20. stochastic / eighth_tone -------------------------------------------
  - stream_id: "B20_stochastic_eighth_tone"
    onset: 150
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 6
      pitch:
        strategy: stochastic
        pitch_range: 24.0     # ±24 ottavi di tono = ±1 ottava
        unit: eighth_tone
    volume: -9

  # --- B21. stochastic / edo (31-EDO) ------------------------------------------
  - stream_id: "B21_stochastic_edo31"
    onset: 155
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 6
      pitch:
        strategy: stochastic
        pitch_range: 15.0     # ±15 gradi di 31-EDO (~±7 semitoni)
        unit: {edo: 31}
    volume: -9

  # --- B22. stochastic / ratio — distribuzione GEOMETRICA SIMMETRICA -----------
  #   _cache in [-1, 1] → materialize(pos, 2.0) = 2^pos.
  #   Voce con pos=-1 → 0.5 (un'ottava sotto), pos=+1 → 2.0 (un'ottava sopra).
  - stream_id: "B22_stochastic_ratio"
    onset: 160
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {ratio: 1.0}
    voices:
      num_voices: 6
      pitch:
        strategy: stochastic
        pitch_range: 2.0      # geometrico simmetrico: fattori in [0.5, 2.0]
        unit: ratio
    volume: -9

  # --- B23. step con step dinamico (Envelope) ----------------------------------
  #   step cresce da 1 a 6 semitoni: voci si allargano nel tempo.
  - stream_id: "B23_step_envelope"
    onset: 165
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 4
      pitch:
        strategy: step
        step: [[0, 1.0], [4, 6.0]]   # spread cresce da 1 st a 6 st
    volume: -9

  # --- B24. range con pitch_range dinamico (Envelope) --------------------------
  #   range cresce 0 → 12 semitoni: voci si aprono da unisono a ottava.
  - stream_id: "B24_range_envelope"
    onset: 170
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch: {semitones: 0}
    voices:
      num_voices: 5
      pitch:
        strategy: range
        pitch_range: [[0, 0.0], [4, 12.0]]   # da unisono a ottava
    volume: -9

  # --- B25. base pitch cents + voices step semitones — combinazione cross-unità --
  #   trasposizione base in cents (+50 = quarto di tono sopra),
  #   distribuzione voci in semitoni (step 3 st).
  - stream_id: "B25_cents_base_step_voices"
    onset: 175
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      cents: 50              # base: +50 cents sopra l'originale
    voices:
      num_voices: 4
      pitch:
        strategy: step
        step: 3.0            # voci a 0, 3, 6, 9 semitoni sopra la base
    volume: -9

  # --- B26. base ratio + voices stochastic ratio — tutto geometrico ------------
  #   trasposizione base 1.5 (quinta giusta), voci distribuite geometricamente.
  - stream_id: "B26_ratio_base_stochastic_ratio_voices"
    onset: 180
    duration: 4
    sample: 001-0-27_9.wav
    density: 20
    grain: {duration: 0.05, envelope: hanning}
    pitch:
      ratio: 1.5             # base: quinta giusta
    voices:
      num_voices: 5
      pitch:
        strategy: stochastic
        pitch_range: 1.5     # fattori geometrici in [1/1.5, 1.5] ≈ [0.667, 1.5]
        unit: ratio
    volume: -9
